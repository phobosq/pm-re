name: PM62C NVIDIA child slot68 ABI
on:
  push:
    paths:
      - 'scripts/filter_child_slot68_abi.py'
      - '.github/workflows/run-child-slot68-abi.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/filter_child_slot68_abi.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvidia_child_slot68_abi_candidates.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: filter NVIDIA child slot68 ABI candidates'
          git fetch origin main
          git rebase origin/main
          git push
