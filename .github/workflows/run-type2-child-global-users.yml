name: PM62C Type2 child global users
on:
  push:
    paths:
      - 'scripts/find_type2_child_global_users.py'
      - '.github/workflows/run-type2-child-global-users.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_type2_child_global_users.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/type2_child_global_users.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: find global Type2 child users'
          git pull --rebase
          git push
