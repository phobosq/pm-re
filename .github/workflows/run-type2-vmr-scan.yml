name: PM62C NVIDIA Type2 VMR scan
on:
  push:
    paths:
      - '.github/workflows/run-type2-vmr-scan.yml'
      - 'scripts/scan_type2_vtable_vmr.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/scan_type2_vtable_vmr.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/type2_vtable_vmr_reads.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: scan Type2 vtable for VMR reads'
          git pull --rebase origin main
          git push
