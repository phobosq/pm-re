name: PM62C NVIDIA child slot80 callers
on:
  push:
    paths:
      - '.github/workflows/run-nvidia-child-slot80-calls.yml'
      - 'scripts/find_nvidia_child_slot80_calls.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_nvidia_child_slot80_calls.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvidia_child_slot80_calls.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: find NVIDIA child slot80 callsites'
          git pull --rebase origin main
          git push
