name: PM62C NVIDIA RegisterOp trace

on:
  push:
    paths:
      - '.github/workflows/run-nvapi-registerop.yml'
      - 'scripts/trace_nvapi_registerop.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Trace NvAPI GPU RegisterOp
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/trace_nvapi_registerop.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvapi_registerop_usage.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: trace NvAPI GPU RegisterOp usage'
          git pull --rebase origin main
          git push
