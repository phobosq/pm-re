name: PM62C NVIDIA child profile writers
on:
  push:
    paths:
      - '.github/workflows/run-nvidia-profile-writers.yml'
      - 'scripts/find_nvidia_child_profile_writers.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_nvidia_child_profile_writers.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvidia_child_profile_writers.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: map NVIDIA child profile writers'
          git pull --rebase origin main
          git push
