name: PM62C NVIDIA Type2 child slot80 bridge
on:
  push:
    paths:
      - '.github/workflows/run-type2-child-slot80.yml'
      - 'scripts/find_type2_to_child_slot80.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_type2_to_child_slot80.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/type2_child_slot80_bridge.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: find Type2 child slot80 bridge'
          git pull --rebase origin main
          git push
