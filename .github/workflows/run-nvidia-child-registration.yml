name: PM62C NVIDIA child registration
on:
  push:
    paths:
      - 'scripts/trace_nvidia_child_registration.py'
      - '.github/workflows/run-nvidia-child-registration.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/trace_nvidia_child_registration.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvidia_child_registration.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: trace NVIDIA child registration'
          git pull --rebase
          git push
