name: PM62C parent90 child80 bridge
on:
  push:
    paths:
      - 'scripts/find_parent90_child80_bridge.py'
      - '.github/workflows/run-parent90-child80.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_parent90_child80_bridge.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/parent90_child80_bridge.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: find parent90 child80 bridge'
          git pull --rebase
          git push
