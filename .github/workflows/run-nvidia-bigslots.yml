name: PM62C NVIDIA big-slot analysis

on:
  push:
    paths:
      - '.github/workflows/run-nvidia-bigslots.yml'
      - 'scripts/profile_nvidia_bigslots_dynamic.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Profile NVIDIA big-slot dynamic calls
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/profile_nvidia_bigslots_dynamic.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/nvidia_bigslots_dynamic.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: profile NVIDIA big-slot dynamic calls'
          git pull --rebase origin main
          git push
