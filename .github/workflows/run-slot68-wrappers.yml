name: PM62C NVIDIA slot68 wrappers
on:
  push:
    paths:
      - 'scripts/find_slot68_wrappers.py'
      - '.github/workflows/run-slot68-wrappers.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/find_slot68_wrappers.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/slot68_wrappers.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: find NVIDIA slot68 wrappers'
          git fetch origin main
          git rebase origin/main
          git push
