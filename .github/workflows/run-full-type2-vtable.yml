name: PM62C full Type2 vtable scan
on:
  push:
    paths:
      - 'scripts/scan_full_type2_vtable.py'
      - '.github/workflows/run-full-type2-vtable.yml'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - run: python scripts/scan_full_type2_vtable.py samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin --out-dir notes
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/full_type2_vtable_timing_scan.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: scan full Type2 vtable timing bridge'
          git pull --rebase
          git push
