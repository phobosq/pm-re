name: PM62C vmr window

on:
  push:
    paths:
      - '.github/workflows/run-vmr-window.yml'
      - 'scripts/decode_dispatcher_refs.py'
      - 'scripts/decode_runtime_container_hotspots.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Decode dispatcher refs and runtime hotspots
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/decode_dispatcher_refs.py "$BIN" --out-dir notes
          python scripts/decode_runtime_container_hotspots.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/dispatcher_ref_contexts.md notes/runtime_container_hotspots.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: decode dispatcher refs and container hotspots'
          git pull --rebase origin main
          git push
