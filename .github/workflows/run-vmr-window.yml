name: PM62C vmr window

on:
  push:
    paths:
      - '.github/workflows/run-vmr-window.yml'
      - 'scripts/dump_pergpu_accessors.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Run focused per-GPU analysis
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/dump_pergpu_accessors.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/pergpu_accessors.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: inspect per-gpu stride accessors'
          git push
