name: PM62C vmr window

on:
  push:
    paths:
      - '.github/workflows/run-vmr-window.yml'
      - 'scripts/decode_runtime_adjuster_13f7e0.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Decode runtime adjuster 0x13F7E0
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/decode_runtime_adjuster_13f7e0.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/runtime_adjuster_13f7e0.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: decode type-safe runtime adjuster 0x13f7e0'
          git pull --rebase origin main
          git push
