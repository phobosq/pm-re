name: PM62C vmr window

on:
  push:
    paths:
      - '.github/workflows/run-vmr-window.yml'
      - 'scripts/dump_vmr_window.py'
      - 'scripts/analyze_vmr_anchor.py'
      - 'scripts/dump_vmr_setter_path.py'
      - 'scripts/dump_vmr_common_and_vtable.py'
      - 'scripts/find_vmr_field_consumers.py'
      - 'scripts/find_vmr_direct_reads.py'
      - 'scripts/summarize_vmr_descriptor_methods.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pefile capstone
      - name: Run vmr analysis
        run: |
          BIN=samples/work/unpacked/PhoenixMiner_6.2c_Windows/PhoenixMiner.exe.bin
          python scripts/dump_vmr_window.py "$BIN" --out-dir notes
          python scripts/dump_vmr_setter_path.py "$BIN" --out-dir notes
          python scripts/dump_vmr_common_and_vtable.py "$BIN" --out-dir notes
          python scripts/find_vmr_field_consumers.py "$BIN" --out-dir notes
          python scripts/find_vmr_direct_reads.py "$BIN" --out-dir notes
          python scripts/summarize_vmr_descriptor_methods.py "$BIN" --out-dir notes
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notes/vmr_window.md notes/vmr_setter_path.md notes/vmr_common_vtable.md notes/vmr_field_consumers.md notes/vmr_direct_reads.md notes/vmr_descriptor_methods.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: summarize vmr descriptor methods'
          git push
